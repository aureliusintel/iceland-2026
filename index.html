<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B78C2">
<title>Iceland Fall 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a field guide. Sticky day strip on top, one day at a time below; road-sign chips carry drive times. */
/* Bright Iceland: glacier blue + moss green on light glacial gray, charcoal for contrast. */
:root{
  --bg:#F8FAFA; --surface:#FFFFFF; --sunk:#EEF2F2; --panel:#ECF0F1; --ink:#23292D; --muted:#5B666B; --line:#D7DFDF;
  --sign:#0B78C2; --sign-ink:#FFFFFF; --moss:#2D8A55; --lagoon:#16A3A0; --ice:#E8F4FB; --leaf:#E6F4EB; --charcoal:#2B3136;
  --warn:#C2502A; --warn-bg:#FBEAE3; --ok-bg:#E2F2E7;
  --bob:#2563A8; --amanda:#8A4FBF; --eva:#E0632F; --t4:#16A3A0; --t5:#A07A12;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
:root{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{-webkit-text-size-adjust:100%}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:var(--sign)}
.opt,.path,.card,.sched{box-shadow:0 1px 2px rgba(35,41,45,.05)} button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sign);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface) linear-gradient(90deg,var(--sign) 0 62%,var(--moss) 62% 100%) top/100% 5px no-repeat;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(35,41,45,.06)}
.bar{max-width:1040px;margin:0 auto;padding:10px 16px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.02em;line-height:1;margin:0;text-transform:uppercase}
h1 small{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.04em;color:var(--muted);text-transform:none;display:block;margin-top:4px}
.me{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);white-space:nowrap}
.me select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
nav.tabs{max-width:1040px;margin:0 auto;padding:8px 16px 0;display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--muted);font-weight:700;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--moss)}
.days{max-width:1040px;margin:0 auto;padding:8px 16px 10px;display:flex;gap:6px;overflow-x:auto}
.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;text-align:left;min-width:76px}
.days button b{font-family:var(--display);font-size:18px;font-weight:800;display:block;line-height:1.05;text-transform:uppercase}
.days button span{font-size:11px;color:var(--muted);font-family:var(--mono)}
.days button[aria-current="true"]{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
.days button[aria-current="true"] span{color:var(--sign-ink);opacity:.85}
.dots{display:inline-flex;gap:3px;margin-top:3px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
section{margin-top:22px}
h2{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;margin:0;text-transform:uppercase;text-wrap:balance;letter-spacing:.01em}
h3{font-family:var(--display);font-weight:800;font-size:20px;margin:0;text-transform:uppercase;letter-spacing:.03em}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dayhead{display:grid;gap:10px;background:var(--panel);color:var(--charcoal);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px 16px}
.dayhead h2,.dayhead .facts b{color:var(--charcoal)}
.dayhead .lede,.dayhead .facts{color:var(--charcoal);opacity:.85}
.dayhead .eyebrow{color:var(--sign)}
.dayhead .chip{background:var(--surface)}
.dayhead .anchor{background:var(--surface)}
.dot{box-shadow:0 0 0 1.5px var(--surface)}
.facts{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:700}
.who{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 4px;font-size:13px;border:1px solid var(--line);background:var(--surface)}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:0 0 auto}
.anchor{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border-radius:var(--r);background:var(--sunk);border:1px dashed var(--line);font-size:14px}
.anchor time{font-family:var(--mono);font-size:13px;font-weight:500}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.path{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;align-content:start}
.path .k{font-family:var(--display);font-weight:800;font-size:15px;color:var(--moss);letter-spacing:.06em}
.path.build{border:1.5px dashed var(--lagoon);background:var(--leaf)}
.path.build.on{border-style:solid;border-color:var(--sign)}
.path p{margin:0;font-size:13.5px;color:var(--muted)}
.path .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700}
.btn.primary{background:var(--sign);border-color:var(--sign);color:var(--sign-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.slot{margin-top:20px}
.slothead{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:10px}
.slothead .eyebrow{margin-left:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:7px;align-content:start;min-width:0}
.opt.mine{border-color:var(--moss);box-shadow:0 0 0 2px var(--moss)}
.opt h4{margin:0;font-size:16px;line-height:1.25}
.opt p{margin:0;font-size:13.5px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sign{font-family:var(--mono);font-size:11.5px;background:var(--sign);color:var(--sign-ink);border-radius:4px;padding:2px 6px;border:1.5px solid var(--sign-ink);outline:1.5px solid var(--sign);white-space:nowrap}
.sign.over{background:var(--warn);outline-color:var(--warn)}
.tag{font-size:11.5px;border-radius:4px;padding:2px 6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.done{background:var(--ok-bg);color:var(--moss);font-weight:700}
.tag.saved{background:var(--sunk);color:var(--ink)}
.tag.warn{background:var(--warn-bg);color:var(--warn);font-weight:700;white-space:normal}
.tag.done{white-space:normal}
.price{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pickrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.pickrow .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.pk{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:2px 9px 2px 3px;cursor:pointer;font-size:12.5px;font-weight:700}
.pk .av{width:20px;height:20px;font-size:11px;opacity:.35}
.pk[aria-pressed="true"]{border-color:currentColor}
.pk[aria-pressed="true"] .av{opacity:1}
.fits{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center}
.links{display:flex;gap:12px;font-size:12.5px;flex-wrap:wrap}
.status{font-size:12.5px;color:var(--muted);padding:8px 12px;border-radius:8px;background:var(--sunk);margin-top:12px}
.status.err{background:var(--warn-bg);color:var(--warn)}
/* schedule */
.sched{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.sched table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px}
.sched th,.sched td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
.sched th{font-weight:700;background:var(--sunk)}
.sched td.slotc{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;width:110px}
.sched td.slotc span{display:block;font-family:var(--mono);font-weight:500;font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0}
.cell{display:grid;gap:2px}
.cell b{font-weight:700}
.cell small{color:var(--muted)}
.empty{color:var(--muted);font-style:italic}
.split{color:var(--warn);font-weight:700;font-size:11.5px}
.same{color:var(--moss);font-weight:700;font-size:11.5px}
.wx{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wxc{background:var(--ice);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:2px;min-width:0}
.wxc .t{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.wxc .t small{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted)}
.wxc .n{font-size:12.5px;color:var(--muted)}
.wxc .l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.wxc.aur{grid-column:1/-1;background:var(--leaf);border-color:var(--moss)}
.wxc.wet{border-color:var(--sign)} .wxc.storm{border-color:var(--warn);background:var(--warn-bg)}
.wxpill{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
details.wear{font-size:13px}
details.wear summary{cursor:pointer;font-weight:700;color:var(--ink);list-style-position:outside}
details.wear ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
details.wear li{margin:2px 0}
.pack{display:flex;flex-wrap:wrap;gap:6px}
.pack span{font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.cell .w{font-size:11.5px;color:var(--muted)}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gatecard{display:grid;gap:12px;width:100%;max-width:360px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.trav{display:grid;gap:10px}
.trav .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:12px;color:var(--muted);display:grid;gap:3px}
input,select{font:inherit;font-size:16px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.ints{display:flex;flex-wrap:wrap;gap:6px}
.ints button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.ints button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lede{max-width:66ch;color:var(--muted);margin:8px 0 0}
.rules li{margin:4px 0}
.overview td.day{font-family:var(--display);font-weight:800;text-transform:uppercase;white-space:nowrap}
@media (max-width:520px){h2{font-size:28px}.trav .row{grid-template-columns:1fr}.me{margin-left:0;width:100%}}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .15s, box-shadow .15s}}
</style>
</head>
<body>


<div id="gate" class="gate" hidden>
  <form id="gateForm" class="card gatecard">
    <h1>Iceland Fall 2026</h1>
    <p class="lede" style="margin:0">Enter the trip passcode Bob sent you.</p>
    <label for="code">Passcode<input id="code" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Open the trip</button>
    <p id="gateMsg" class="eyebrow" role="alert"></p>
  </form>
</div>
<div id="app" hidden>
<header class="top">
  <div class="bar">
    <h1>Iceland Fall 2026<small id="tripline">Oct 7–13 · KEF in, KEF out</small></h1>
    <div class="me"><label for="meSel" style="display:inline">Picking as</label>
      <select id="meSel"></select></div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-day" aria-selected="true">Choose the day</button>
    <button role="tab" id="tab-sched" aria-selected="false">Schedule</button>
    <button role="tab" id="tab-trip" aria-selected="false">Trip &amp; travelers</button>
  </nav>
  <div class="days" id="dayStrip"></div>
</header>

<main class="wrap">
  <div id="dbStatus" class="status">Loading the trip…</div>
  <div id="view"></div>
</main>
</div>

Object.entries(EXTRA).forEach(([day,slots])=>{
  const d = DAYS.find(x=>x.id===day); if(!d) return;
  Object.entries(slots).forEach(([slot,arr])=>{
    d.opts[slot] = d.opts[slot] || [];
    arr.forEach(o=>{ if(d.opts[slot].some(x=>x.id===o.id)) return; LK[o.id]=o.lk; const {lk,...rest}=o; d.opts[slot].push(rest); });
  });
});

const OPT = {}; DAYS.forEach(d=>Object.entries(d.opts).forEach(([s,arr])=>arr.forEach(o=>OPT[o.id]={...o,slot:s,day:d.id})));
const MAX_DRIVE = 180;

/* ---------- State ---------- */
let travelers = [];   // from db
let picks = {};       // key day|slot|traveler -> optionId
let db = null, canWrite = true;
let view = "day", dayId = DAYS[0].id;
const building = {};
let me = null;
try{ me = localStorage.getItem("ice26-me"); const v=localStorage.getItem("ice26-view"); if(v) view=v; const d=localStorage.getItem("ice26-day"); if(d && DAYS.some(x=>x.id===d)) dayId=d; }catch(e){}

function colorOf(t){ const i = travelers.findIndex(x=>x.id===t.id); return "var("+(t.color||PALETTE[i%PALETTE.length])+")"; }
function present(t, day){
  const a = t.arriveDate||DAYS[0].id, b = t.departDate||DAYS[DAYS.length-1].id;
  return day>=a && day<=b;
}
function here(day){ return travelers.filter(t=>present(t,day)); }
function fullGroup(day){ return travelers.length>0 && here(day).length===travelers.length; }
function avatar(t,size){ return `<span class="av" style="background:${colorOf(t)}${size?`;width:${size}px;height:${size}px`:""}" aria-hidden="true">${esc((t.name||"?")[0])}</span>`; }
function pickKey(d,s,t){ return d+"|"+s+"|"+t; }
const SINGLE = {stay:1}; // one place to sleep; everything else can hold several picks
function picksOf(d,s,t){ return picks[pickKey(d,s,t)] || []; }
function hasPick(d,s,t,o){ return picksOf(d,s,t).includes(o); }

/* ---------- Render ---------- */
function renderMe(){
  const sel = $("#meSel");
  sel.innerHTML = `<option value="">Choose…</option>`+travelers.map(t=>`<option value="${esc(t.id)}" ${t.id===me?"selected":""}>${esc(t.name)}</option>`).join("");
}
function renderStrip(){
  $("#dayStrip").hidden = (view==="trip");
  $("#dayStrip").innerHTML = DAYS.map(d=>{
    const h = here(d.id);
    return `<button data-day="${d.id}" aria-current="${d.id===dayId}"><b>${d.dow} ${d.label.split(" ")[1]}</b><span>${esc(d.region.split(" · ")[0])}</span><br><span class="dots">${h.map(t=>`<i class="dot" style="background:${colorOf(t)}"></i>`).join("")}</span></button>`;
  }).join("");
  ["day","sched","trip"].forEach(v=>$("#tab-"+v).setAttribute("aria-selected", v===view));
}
function render(){
  renderMe(); renderStrip();
  const el = $("#view");
  if(view==="day") el.innerHTML = renderDay(); else if(view==="sched") el.innerHTML = renderSched(); else el.innerHTML = renderTrip();
}

function fitsFor(o, ppl){
  return ppl.filter(t=>(t.interests||[]).some(i=>o.tags.includes(i)));
}
function renderOpt(o, d, ppl){
  const [loc,kind] = (LK[o.id]||"rvk city").split(" ");
  const w = wxFor(loc, d.id); const wr = wear(kind, w); const flag = wxFlag(kind, w);
  const over = o.drive>MAX_DRIVE && fullGroup(d.id);
  const mineSel = me && hasPick(d.id,o.slot,me,o.id);
  const fits = fitsFor(o, ppl);
  return `<article class="opt ${mineSel?"mine":""}">
    <div class="meta">
      ${o.drive?`<span class="sign ${over?"over":""}" title="Drive from ${esc(o.from||"")}">${esc(o.road||"")} · ${fmtDrive(o.drive)}${o.from?" from "+esc(o.from):""}</span>`:""}
      ${o.p?`<span class="price">${esc(o.p)}</span>`:""}
      ${kind!=="stay"&&kind!=="rest"?`<span class="wxpill" title="${esc(LOCS[loc])} forecast">${w.hi}°/${w.lo}°C${w.mm!=null?" · "+w.mm+" mm":""} · ${w.wind} m/s</span>`:""}
    </div>
    <h4>${esc(o.t)}</h4>
    <p>${esc(o.d)}</p>
    <div class="meta">
      ${o.done?`<span class="tag done">${o.done} · Bob & Amanda</span>`:""}
      ${o.saved?`<a class="tag saved" href="${esc(o.saved.url)}" target="_blank" rel="noopener">Saved · @${esc(o.saved.handle)}</a>`:""}
      ${o.warn?`<span class="tag warn">${esc(o.warn)}</span>`:""}
      ${over?`<span class="tag warn">Over the 3-hour drive rule for this day</span>`:""}
      ${flag?`<span class="tag ${/good/.test(flag)?"done":"warn"}">${esc(flag)}</span>`:""}
    </div>
    ${wr?`<details class="wear"><summary>What to wear</summary><ul>${wr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`:""}
    ${fits.length?`<div class="fits">Fits ${fits.map(t=>avatar(t,16)+esc(t.name)).join(", ")}</div>`:""}
    <div class="links"><a href="${mapUrl(o)}" target="_blank" rel="noopener">Map</a>${o.link?`<a href="${esc(o.link)}" target="_blank" rel="noopener">Book / browse</a>`:""}</div>
    <div class="pickrow"><span class="lbl">Pick:</span>${ppl.map(t=>{
      const on = hasPick(d.id,o.slot,t.id,o.id);
      return `<button class="pk" style="color:${colorOf(t)}" aria-pressed="${on}" data-pick="${o.id}" data-t="${esc(t.id)}" ${canWrite&&db?"":"disabled"}>${avatar(t)}<span style="color:var(--ink)">${esc(t.name)}</span></button>`;
    }).join("")}</div>
  </article>`;
}
function renderDay(){
  const d = DAYS.find(x=>x.id===dayId); const ppl = here(d.id);
  const mt = travelers.find(t=>t.id===me);
  return `<section class="dayhead">
      <div class="eyebrow">${d.dow} ${d.label}, 2026 · ${esc(d.region)}</div>
      <h2>${esc(d.title)}</h2>
      <p class="lede">${esc(d.note)}</p>
      <div class="facts"><span>Sunrise / sunset <b>${d.sun}</b></span><span>Drive rule <b>${fullGroup(d.id)?"3 h max per drive":"no limit, drive as far as you like"}</b></span></div>
      <div class="who">${ppl.length?ppl.map(t=>`<span class="chip">${avatar(t)}${esc(t.name)}</span>`).join(""):`<span class="empty">Add travelers on the Trip tab to see who's here.</span>`}</div>
      ${d.anchors.map(a=>`<div class="anchor"><time>${esc(a.t)}</time><span>${esc(a.x)}</span></div>`).join("")}
    </section>
    ${renderWx(d)}
    <section>
      <div class="slothead"><h3>Pick a path</h3><span class="eyebrow">or build your own</span></div>
      <div class="paths">${d.paths.map(p=>`<div class="path"><span class="k">PATH ${p.k}</span><strong>${esc(p.name)}</strong><p>${esc(p.d)}</p>
        <div class="acts"><button class="btn primary" data-path="${p.k}" data-scope="me" ${db&&canWrite&&mt&&present(mt,d.id)?"":"disabled"}>${mt?"Take it as "+esc(mt.name):"Choose who you are first"}</button>
        <button class="btn" data-path="${p.k}" data-scope="all" ${db&&canWrite&&ppl.length?"":"disabled"}>Everyone</button></div></div>`).join("")}
        <div class="path build ${building[d.id]?"on":""}"><span class="k">BUILD YOUR OWN</span><strong>Mix and match</strong><p>Choose each part of the day yourself: activities, lunch, dinner, the night out and where to sleep.</p>
          <div class="acts"><button class="btn ${building[d.id]?"":"primary"}" data-build="${d.id}" aria-expanded="${!!building[d.id]}">${building[d.id]?"Hide the options":"Start building"}</button></div></div>
      </div>
    </section>
    ${building[d.id] ? SLOTS.filter(s=>d.opts[s.id]).map(s=>`<section class="slot"><div class="slothead"><h3>${s.name}</h3><span class="eyebrow">${SLOT_KIND[s.id]} · ${SINGLE[s.id]?"pick one":"pick as many as you like"} · ${s.time}</span></div>
      <div class="opts">${d.opts[s.id].map(o=>renderOpt(OPT[o.id],d,ppl)).join("")}</div></section>`).join("")
      + `<section class="slot"><button class="btn primary" data-build="${d.id}" data-done="1">Done building</button></section>`
      : renderMyDay(d, mt)}`;
}
const SLOT_KIND = {morning:"Activity", midday:"Lunch or activity", afternoon:"Activity", dinner:"Dinner", evening:"Night out", stay:"Where to sleep"};
function renderMyDay(d, mt){
  if(!mt || !present(mt,d.id)) return `<section class="slot"><p class="empty" style="margin:0">${mt?esc(mt.name)+" isn't here this day.":"Choose who you are at the top to see your day."}</p></section>`;
  const rows = SLOTS.filter(s=>d.opts[s.id]).map(s=>{ const os = picksOf(d.id,s.id,mt.id).map(id=>OPT[id]).filter(Boolean);
    return `<tr><td class="slotc">${s.name}<span>${s.time}</span></td><td>${os.length?`<div class="cell" style="gap:6px">${os.map(o=>`<div><b>${esc(o.t)}</b><br><small>${esc(o.where||"")}</small></div>`).join("")}</div>`:`<span class="empty">Not picked yet</span>`}</td></tr>`; }).join("");
  return `<section class="slot"><div class="slothead"><h3>${esc(mt.name)}'s day</h3><span class="eyebrow">your picks</span></div>
    <div class="sched"><table style="min-width:0"><tbody>${rows}</tbody></table></div></section>`;
}

function dayLocs(d){ const seen=[]; Object.values(d.opts).flat().forEach(o=>{ const l=(LK[o.id]||"rvk").split(" ")[0]; if(!seen.includes(l)) seen.push(l); }); return seen; }
function packFor(d, tid){
  const items = new Set();
  SLOTS.forEach(s=>{ if(!tid) return; picksOf(d.id,s.id,tid).forEach(oid=>{ const [loc,kind]=(LK[oid]||"rvk city").split(" "); (wear(kind, wxFor(loc,d.id))||[]).forEach(x=>items.add(x)); }); });
  items.delete("casual is fine");
  if(items.has("waterproof jacket and rain pants")||items.has("waterproof, windproof shell")) items.delete("packable rain jacket for the walk");
  return [...items];
}
function updatedLabel(){
  if(!LIVE || !LIVE.fetchedAt) return WX_FETCHED;
  const t = new Date(LIVE.fetchedAt); if(isNaN(t)) return WX_FETCHED;
  const mins = Math.round((Date.now()-t.getTime())/60000);
  const ago = mins<60 ? mins+" min ago" : mins<48*60 ? Math.round(mins/60)+" h ago" : Math.round(mins/1440)+" days ago";
  return ago + (refreshState ? " · "+refreshState : "");
}
function auroraCard(d){
  if(d.id==="2026-10-13") return "";
  const evOpt = (d.opts.evening||[])[0] || (d.opts.stay||[])[0];
  const loc = evOpt ? (LK[evOpt.id]||"rvk").split(" ")[0] : "rvk";
  const a = auroraFor(d.id, loc);
  const cls = a.rate==="Excellent"||a.rate==="Good" ? "" : a.rate==="Poor" ? "storm" : "wet";
  return `<div class="wxc aur ${cls}" style="margin-top:8px">
    <span class="l">Northern Lights tonight · ${esc(LOCS[loc])}</span>
    <span class="t">${esc(a.rate)} <small>Kp ${a.kp} · moon ${a.moon}% lit</small></span>
    <span class="n">${esc(a.why)}. Kp ${a.kp} is ${a.kp>=4?"strong; it can fill the sky":a.kp>=3?"moderate; easily visible this far north":a.kp>=2?"quiet but often visible overhead in Iceland":"very quiet"}. The moon is ${a.moon<10?"near new, so skies are dark":"thin"}.</span>
    <span class="n">Dark from about 19:30; best 22:00–01:00. On the day, check cloud cover on the <a href="https://en.vedur.is/weather/forecasts/aurora/" target="_blank" rel="noopener">Icelandic Met Office aurora map</a>. Kp source: ${esc(a.src)}.</span>
  </div>`;
}
function renderWx(d){
  const locs = dayLocs(d);
  const cards = locs.map(l=>{ const w=wxFor(l,d.id); const cls = w.wind>=13||w.mm>=20 ? "storm" : (w.mm||0)>=5 ? "wet" : "";
    return `<div class="wxc ${cls}"><span class="l">${esc(LOCS[l])}</span><span class="t">${w.hi}° <small>/ ${w.lo}°C · ${toF(w.hi)}/${toF(w.lo)}°F</small></span>
      <span class="n">${esc(w.desc)}</span><span class="n">${w.mm!=null?w.mm+" mm rain · ":""}wind ${w.wind} m/s (${mph(w.wind)} mph)</span></div>`; }).join("");
  const mt = travelers.find(t=>t.id===me);
  const pack = mt && present(mt,d.id) ? packFor(d, me) : [];
  return `<section><div class="slothead"><h3>Weather</h3><span class="eyebrow">MET Norway / yr.no · updated ${esc(updatedLabel())}</span></div>
    <p class="lede" style="margin:0 0 10px">${esc(noteFor(d.id))}</p>
    <div class="wx">${cards}</div>
    ${auroraCard(d)}
    <div style="margin-top:12px"><div class="eyebrow" style="margin-bottom:6px">${mt?"Pack today for "+esc(mt.name)+"’s picks":"Pack today"}</div>
    ${pack.length?`<div class="pack">${pack.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:`<p class="empty" style="margin:0">${mt?"Pick a few things below and this fills in with what to wear for them.":"Choose who you are at the top, make picks, and this lists what to wear for them."}</p>`}</div>
  </section>`;
}
function renderSchedDay(d){
  const ppl = here(d.id);
  if(!ppl.length) return `<p class="empty">No travelers on this day.</p>`;
  const rows = SLOTS.filter(s=>d.opts[s.id]).map(s=>{
    const sets = ppl.map(t=>picksOf(d.id,s.id,t.id).slice().sort().join(","));
    const filled = sets.filter(Boolean);
    const uniq = [...new Set(filled)];
    const agree = filled.length===ppl.length && uniq.length===1;
    const flag = filled.length===0 ? "" : agree ? `<span class="same">Together</span>` : uniq.length>1 ? `<span class="split">Split</span>` : `<span class="split">Waiting on picks</span>`;
    return `<tr><td class="slotc">${s.name}<span>${s.time}</span>${flag}</td>${ppl.map(t=>{
      const os = picksOf(d.id,s.id,t.id).map(id=>OPT[id]).filter(Boolean);
      if(!os.length) return `<td><span class="empty">Not picked</span></td>`;
      return `<td><div class="cell" style="gap:8px">${os.map(o=>{
        const [loc,kind]=(LK[o.id]||"rvk city").split(" "); const w=wxFor(loc,d.id); const wr=wear(kind,w);
        const wl = (kind!=="stay"&&kind!=="rest"?`${w.hi}°/${w.lo}°C, ${w.mm!=null?w.mm+" mm":"avg"}`:"") + (wr?" · Wear: "+wr.slice(0,3).join(", "):"");
        return `<div class="cell"><b>${esc(o.t)}</b><small>${esc(o.where||"")}${o.drive?" · "+fmtDrive(o.drive):""}</small>${wl?`<span class="w">${esc(wl)}</span>`:""}</div>`;
      }).join("")}</div></td>`;
    }).join("")}</tr>`;
  }).join("");
  return `<div class="sched"><table><thead><tr><th>${d.dow} ${d.label}</th>${ppl.map(t=>`<th><span class="chip" style="border:0;padding:0;background:none">${avatar(t)}${esc(t.name)}</span></th>`).join("")}</tr></thead>
    <tbody>${d.anchors.map(a=>`<tr><td class="slotc">${esc(a.t)}</td><td colspan="${ppl.length}">${esc(a.x)}</td></tr>`).join("")}${rows}</tbody></table></div>`;
}
function renderSched(){
  const d = DAYS.find(x=>x.id===dayId);
  const totals = DAYS.map(x=>{ const ppl=here(x.id); const n=SLOTS.filter(s=>x.opts[s.id]).length*ppl.length; let got=0; ppl.forEach(t=>SLOTS.forEach(s=>{ if(picksOf(x.id,s.id,t.id).length) got++; })); return {x,got,n}; });
  return `<section class="dayhead"><div class="eyebrow">Schedule</div><h2>${d.dow} ${d.label}: ${esc(d.title)}</h2>
    <p class="lede">Each column is one person's picks. "Split" means you've chosen different things for that slot, which is fine if you plan to split up.</p></section>
    <section>${renderSchedDay(d)}</section>
    <section><div class="slothead"><h3>Whole trip</h3><span class="eyebrow">picks made</span></div>
    <div class="sched overview"><table><tbody>${totals.map(({x,got,n})=>`<tr><td class="day">${x.dow} ${x.label}</td><td>${esc(x.title)}</td><td style="font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap">${got} / ${n}</td><td><button class="btn" data-goto="${x.id}">Open</button></td></tr>`).join("")}</tbody></table></div></section>`;
}
function renderTrip(){
  return `<section class="dayhead"><div class="eyebrow">Trip setup</div><h2>Who's going</h2>
    <p class="lede">Arrival and departure dates decide which days each person appears on. Interests decide the “Fits” line on each option. Changes save for everyone.</p></section>
    <section class="grid2">${travelers.map(t=>travCard(t)).join("")}
      <div class="card trav"><h3>Add a traveler</h3><label for="newName">Name<input id="newName" placeholder="Name" value="${esc(newNameDraft)}" enterkeyhint="done"></label><button class="btn primary" id="addTrav" ${db&&canWrite?"":"disabled"}>Add</button></div>
    </section>
        <section class="card"><h3>Packing list for this forecast</h3>
      <p class="lede" style="margin:0 0 8px">Highs 2–11 °C (36–52 °F), lows down to −2 °C (28 °F), two very wet days (Oct 8 and 12) and one dry, clear, cold one (Oct 10).</p>
      <ul class="rules">
        <li><b>Shell:</b> a fully waterproof, hooded jacket and rain pants each. This matters more than anything else on the list.</li>
        <li><b>Warmth:</b> merino or synthetic base layers, a fleece or wool sweater, and a packable insulated jacket. No cotton next to the skin.</li>
        <li><b>Feet:</b> waterproof hiking boots with grip, wool socks (several pairs), and city shoes that can take rain.</li>
        <li><b>Small stuff:</b> beanie, gloves, buff or scarf, sunglasses for glacier glare, a quick-dry towel.</li>
        <li><b>Water:</b> swimsuits (two each, so one can dry), flip-flops for the lagoons.</li>
        <li><b>Nights:</b> one smart-casual outfit for the Michelin dinners, going-out clothes for Fri and Mon, and a thermos for aurora watching.</li>
        <li><b>Leave home:</b> umbrellas (Icelandic wind breaks them) and jeans for anything outdoors.</li>
      </ul></section>
    <section class="card"><h3>Where these options came from</h3><p class="lede" style="margin:0">36 posts in your “Iceland 2026” Instagram collection, the GPS and dates from your Jan 31–Feb 9 ring-road photos (marked “Done Feb ’26”), current hours and prices from the venues' sites, and point forecasts from yr.no (Norwegian Meteorological Institute) for each area. The forecast refreshes whenever anyone opens the app and it is more than 3 hours old, plus once a day automatically. Aurora strength (Kp) comes from NOAA's Space Weather Prediction Center.</p></section>`;
}
function travCard(t){
  const ints = Object.entries(INTERESTS).map(([k,v])=>`<button data-int="${k}" data-t="${esc(t.id)}" aria-pressed="${(t.interests||[]).includes(k)}">${v}</button>`).join("");
  const f = (k,lab,type,val)=>`<label for="${k}-${esc(t.id)}">${lab}<input id="${k}-${esc(t.id)}" type="${type}" value="${esc(val||"")}" data-field="${k}" data-t="${esc(t.id)}" ${db&&canWrite?"":"disabled"}></label>`;
  return `<div class="card trav"><div style="display:flex;align-items:center;gap:8px">${avatar(t,30)}<h3>${esc(t.name)}</h3>${t.age?`<span class="eyebrow">age ${esc(t.age)}</span>`:""}</div>
    <div class="row">${f("name","Name","text",t.name)}${f("age","Age","number",t.age)}</div>
    <div class="row">${f("arriveDate","Arrives","date",t.arriveDate)}${f("arriveTime","Time","time",t.arriveTime)}</div>
    <div class="row">${f("departDate","Leaves","date",t.departDate)}${f("departTime","Time","time",t.departTime)}</div>
    <div class="row">${f("arriveAt","Arrival airport","text",t.arriveAt)}${f("departAt","Departure airport","text",t.departAt)}</div>
    <div><div class="eyebrow" style="margin-bottom:6px">Interests</div><div class="ints">${ints}</div></div>
    <div><button class="btn" data-remove="${esc(t.id)}" ${db&&canWrite?"":"disabled"}>Remove ${esc(t.name)}</button> <span class="eyebrow" id="rm-${esc(t.id)}"></span></div></div>`;
}

/* ---------- Writes ---------- */
function setStatus(msg, err){ const s=$("#dbStatus"); s.hidden=!msg; s.textContent=msg||""; s.classList.toggle("err",!!err); }
let CODE = null; try{ CODE = localStorage.getItem("ice26-code"); }catch(e){}
async function api(path, opts={}){
  const r = await fetch(path, {...opts, headers:{"content-type":"application/json","x-trip-code":CODE||"",...(opts.headers||{})}});
  if(r.status===401){ lockOut(); throw {code:"auth"}; }
  if(!r.ok) throw {code:"server", status:r.status};
  return r.json();
}
// action: "add" | "remove" | "replace" (replace = this option only; option null clears the slot)
async function writePick(day,slot,tid,optId,action){
  const key = pickKey(day,slot,tid), prev = (picks[key]||[]).slice();
  let next = prev.slice();
  if(action==="add") next = SINGLE[slot] ? [optId] : [...new Set([...prev,optId])];
  else if(action==="remove") next = prev.filter(x=>x!==optId);
  else next = optId ? [optId] : [];
  if(next.length) picks[key]=next; else delete picks[key];
  inflight++; render();
  try{ await api("/api/pick",{method:"POST",body:JSON.stringify({day,slot,traveler:tid,option:optId||null,action})}); }
  catch(e){ if(prev.length) picks[key]=prev; else delete picks[key]; handleErr(e); render(); }
  finally{ inflight--; }
}
function handleErr(e){
  if(e && e.code==="auth") return;
  setStatus("Couldn't save that change. Check your connection and try again.", true);
}
const pending = {};
let inflight = 0, needsRender = false, newNameDraft = "";
function saveTraveler(t){
  clearTimeout(pending[t.id]);
  pending[t.id] = setTimeout(async()=>{
    delete pending[t.id]; inflight++;
    try{ await api("/api/traveler",{method:"POST",body:JSON.stringify(t)}); }catch(e){ handleErr(e); }
    finally{ inflight--; setTimeout(()=>{ if(needsRender && !isEditing()){ needsRender=false; render(); } }, 50); }
  },600);
}
// True while someone is typing or a traveler change hasn't reached the server yet.
function isEditing(){
  const a = document.activeElement;
  const typing = a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.closest("#view");
  return !!typing || inflight>0 || Object.keys(pending).length>0;
}
async function addTraveler(){
  const name=newNameDraft.trim(); if(!name) return;
  let id=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"t"; while(travelers.some(x=>x.id===id)) id+="2";
  const used=travelers.map(x=>x.color); const color=PALETTE.find(c=>!used.includes(c))||PALETTE[travelers.length%PALETTE.length];
  const t={id,name,age:"",interests:[],arriveDate:DAYS[0].id,departDate:DAYS[DAYS.length-1].id,arriveTime:"",departTime:"",arriveAt:"KEF",departAt:"KEF",color,order:travelers.length+1};
  travelers.push(t); newNameDraft=""; if(document.activeElement) document.activeElement.blur(); render();
  inflight++;
  try{ await api("/api/traveler",{method:"POST",body:JSON.stringify(t)}); setStatus(name+" added."); }
  catch(e){ travelers=travelers.filter(x=>x.id!==id); newNameDraft=name; render(); handleErr(e); }
  finally{ inflight--; }
  load().catch(()=>{});
}

/* ---------- Events ---------- */
document.addEventListener("click", async ev=>{
  const b = ev.target.closest("button,a"); if(!b) return;
  if(b.dataset.day){ dayId=b.dataset.day; if(view==="trip") view="day"; persist(); render(); scrollTo({top:0}); return; }
  if(b.id&&b.id.startsWith("tab-")){ view=b.id.slice(4); persist(); render(); return; }
  if(b.dataset.build){
    const id=b.dataset.build; building[id]=!building[id]; render();
    if(building[id]) document.querySelector(".slot")?.scrollIntoView({behavior:"smooth",block:"start"});
    else if(b.dataset.done) document.querySelector(".paths")?.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  if(b.dataset.goto){ dayId=b.dataset.goto; view="day"; persist(); render(); scrollTo({top:0}); return; }
  if(!db||!canWrite) return;
  if(b.dataset.pick){
    const o=OPT[b.dataset.pick], tid=b.dataset.t;
    const on = hasPick(o.day,o.slot,tid,o.id);
    await writePick(o.day,o.slot,tid,o.id, on?"remove":"add"); return;
  }
  if(b.dataset.path){
    const d=DAYS.find(x=>x.id===dayId), p=d.paths.find(x=>x.k===b.dataset.path);
    const who = b.dataset.scope==="all" ? here(d.id).map(t=>t.id) : [me];
    for(const tid of who) for(const [s,oid] of Object.entries(p.set)) await writePick(d.id,s,tid,oid,"replace");
    return;
  }
  if(b.dataset.int){
    const t=travelers.find(x=>x.id===b.dataset.t); if(!t) return;
    const set=new Set(t.interests||[]); set.has(b.dataset.int)?set.delete(b.dataset.int):set.add(b.dataset.int);
    t.interests=[...set]; render(); saveTraveler(t); return;
  }
  if(b.id==="addTrav"){ await addTraveler(); return; }
  if(b.dataset.remove){
    const span=$("#rm-"+CSS.escape(b.dataset.remove));
    if(b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.textContent="Tap again to remove"; return; }
    try{ await api("/api/traveler?id="+encodeURIComponent(b.dataset.remove),{method:"DELETE"}); await load(); }catch(e){ handleErr(e); } return;
  }
});
document.addEventListener("input", ev=>{
  const i=ev.target;
  if(i.id==="newName"){ newNameDraft=i.value; return; }
  if(!i.dataset.field) return;
  const t=travelers.find(x=>x.id===i.dataset.t); if(!t) return;
  t[i.dataset.field]=i.value; saveTraveler(t);
});
document.addEventListener("keydown", ev=>{
  if(ev.target.id==="newName" && ev.key==="Enter"){ ev.preventDefault(); addTraveler(); }
});
document.addEventListener("focusout", ()=>{
  setTimeout(()=>{ if(needsRender && !isEditing()){ needsRender=false; render(); } }, 250);
});
document.addEventListener("change", ev=>{
  // Don't redraw the form under a date/time picker; update the day strip now, the rest when they leave the field.
  if(ev.target.dataset.field){ renderStrip(); needsRender = true; }
  if(ev.target.id==="meSel"){ me=ev.target.value||null; persist(); render(); }
});
function persist(){ try{ localStorage.setItem("ice26-view",view); localStorage.setItem("ice26-day",dayId); if(me) localStorage.setItem("ice26-me",me); else localStorage.removeItem("ice26-me"); }catch(e){} }

/* ---------- Boot ---------- */
function lockOut(){
  CODE=null; try{ localStorage.removeItem("ice26-code"); }catch(e){}
  $("#gate").hidden=false; $("#app").hidden=true;
}
async function load(){
  const st = await api("/api/state");
  const editing = isEditing();
  // Never overwrite travelers someone is editing; picks and weather can always refresh.
  if(!editing) travelers = st.travelers;
  const next={}; st.picks.forEach(x=>{ const k=pickKey(x.day,x.slot,x.traveler); (next[k] ||= []).includes(x.option) || next[k].push(x.option); });
  if(!inflight) picks=next;  // don't clobber a pick that's still saving
  if(st.weather) LIVE = st.weather;
  refreshState = st.refreshing ? "refreshing now" : "";
  if(me && !travelers.some(t=>t.id===me)) me=null;
  setStatus(travelers.length?"":"No travelers yet. Add them on the Trip tab.");
  if(!editing) render(); else { needsRender = true; }
  if(st.refreshing) setTimeout(()=>load().catch(()=>{}), 20000);
}
async function start(){
  $("#gate").hidden=true; $("#app").hidden=false;
  db = true; render();
  try{ await load(); }catch(e){ if(e.code!=="auth") setStatus("Couldn't reach the trip server. Reload to try again.", true); }
}
setInterval(()=>{ if(CODE && document.visibilityState==="visible") load().catch(()=>{}); }, 20000);
document.addEventListener("visibilitychange",()=>{ if(CODE && document.visibilityState==="visible") load().catch(()=>{}); });
$("#gateForm").addEventListener("submit", async ev=>{
  ev.preventDefault();
  CODE = $("#code").value.trim();
  try{ await api("/api/login"); try{ localStorage.setItem("ice26-code",CODE); }catch(e){} start(); }
  catch(e){ $("#gateMsg").textContent = e.code==="auth" ? "That passcode didn't work." : "Couldn't reach the server."; $("#gate").hidden=false; $("#app").hidden=true; }
});
if(CODE) start(); else lockOut();
</script>
